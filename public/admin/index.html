<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Content Manager</title>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // 下書きを /preview に送り、返ってきた実ページの HTML を iframe に表示する
    CMS.registerPreviewTemplate('blog', createClass({
      getInitialState: function () {
        return { html: '' };
      },
      componentDidMount: function () {
        this.load();
      },
      componentDidUpdate: function (prevProps) {
        if (prevProps.entry !== this.props.entry) this.load();
      },
      componentWillUnmount: function () {
        clearTimeout(this.timer);
      },
      load: function () {
        var self = this;
        clearTimeout(this.timer);
        this.timer = setTimeout(function () {
          fetch('/preview', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(self.props.entry.get('data').toJS()),
          })
            .then(function (res) { return res.text(); })
            .then(function (html) { self.setState({ html: html }); });
        }, 300);
      },
      render: function () {
        return h('iframe', {
          srcDoc: this.state.html,
          // Decap のプレビュー領域は高さが確定していないため、viewport 基準で全面に広げる
          style: { position: 'fixed', top: 0, left: 0, width: '100%', height: '100%', border: 0 },
        });
      },
    }));
  </script>
</body>
</html>
